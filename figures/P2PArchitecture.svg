<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Helvetica, Arial, sans-serif">
  <title>DAGonFS peer-to-peer model</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="830" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">DAGonFS peer-to-peer model</text>
  <text x="600" y="54" text-anchor="middle" font-size="13" fill="#4b5563"><tspan font-family="Menlo, monospace" font-size="12">dagonfs --model peer-to-peer</tspan>: every peer mounts &lt;root&gt;/&lt;rank&gt;, serves its own mount and replicates namespace changes to the others</text>
  <rect x="20" y="66" width="545" height="550" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="36" y="88" font-size="13" font-weight="bold" fill="#6b7280">Node of peer 0</text>
  <rect x="40" y="98" width="250" height="44" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="165" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">Workflow tasks on this node</text>
  <text x="165" y="133" text-anchor="middle" font-size="11.5" fill="#713f12">POSIX calls, Python, shell tools</text>
  <rect x="360" y="98" width="185" height="44" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="452.5" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#0c4a6e">Mount point</text>
  <text x="452.5" y="134" text-anchor="middle" font-size="12" font-family="Menlo, monospace" fill="#0c4a6e">&lt;root&gt;/0</text>
  <line x1="290" y1="120" x2="360" y2="120" stroke="#374151" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="452.5" y1="142" x2="452.5" y2="162" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="162" width="505" height="34" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="292.5" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Linux VFS + FUSE kernel module</text>
  <rect x="40" y="216" width="505" height="384" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="56" y="238" font-size="15" font-weight="bold" fill="#14532d">Peer 0 · dagonfs</text>
  <text x="529" y="238" text-anchor="end" font-size="12" font-weight="bold" fill="#831843">lock coordinator (rank 0)</text>
  <line x1="310" y1="196" x2="310" y2="266" stroke="#374151" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="318" y="212" font-size="11" font-family="Menlo, monospace" fill="#4b5563">/dev/fuse</text>
  <rect x="56" y="266" width="473" height="38" rx="6" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
  <text x="292.5" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">FUSE thread: FileSystem handlers</text>
  <line x1="130" y1="304" x2="130" y2="320" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="292" y1="304" x2="292" y2="320" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="454" y1="304" x2="454" y2="320" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="56" y="320" width="149" height="64" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="130.5" y="339" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Namespace replica</text>
  <text x="130.5" y="356" text-anchor="middle" font-size="10.5" fill="#1f2937">same tree on every peer</text>
  <text x="130.5" y="371" text-anchor="middle" font-size="10.5" fill="#1f2937">gid → File index</text>
  <rect x="218" y="320" width="149" height="64" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="292.5" y="339" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">Front-end buffer</text>
  <text x="292.5" y="356" text-anchor="middle" font-size="10.5" fill="#1e3a8a">File::m_buf, open → close</text>
  <text x="292.5" y="371" text-anchor="middle" font-size="10.5" fill="#1e3a8a">reloaded if changed remotely</text>
  <rect x="380" y="320" width="149" height="64" rx="6" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="454.5" y="339" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#831843">Lock table</text>
  <text x="454.5" y="356" text-anchor="middle" font-size="10.5" fill="#831843">locks of the whole volume</text>
  <text x="454.5" y="371" text-anchor="middle" font-size="10.5" fill="#831843">waiters, deadlock detection</text>
  <rect x="56" y="400" width="230" height="56" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="171" y="421" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">Listener thread</text>
  <text x="171" y="439" text-anchor="middle" font-size="11" fill="#4c1d95">slices, ACKs, LOCK_*; queues replays</text>
  <rect x="299" y="400" width="230" height="56" rx="6" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/>
  <text x="414" y="421" text-anchor="middle" font-size="13" font-weight="bold" fill="#881337">Replayer thread</text>
  <text x="414" y="439" text-anchor="middle" font-size="11" fill="#881337">replays remote namespace ops (FIFO)</text>
  <polyline points="529,420 556,420 556,179 545,179" fill="none" stroke="#be123c" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
  <line x1="292" y1="384" x2="292" y2="472" stroke="#374151" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="170" y1="456" x2="170" y2="472" stroke="#374151" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="56" y="472" width="473" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="292.5" y="497" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Data plane: DataBlockManager <tspan font-weight="normal" font-size="11.5">(scatterStore · gatherLoad)</tspan></text>
  <line x1="292" y1="512" x2="292" y2="524" stroke="#374151" stroke-width="1.5"/>
  <rect x="56" y="524" width="473" height="44" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="70" y="551" font-size="12.5" font-weight="bold" fill="#1e3a8a">Block registry: slice c<tspan font-size="9" dy="3">0</tspan><tspan dy="-3"> of every file</tspan></text>
  <rect x="288" y="533" width="34" height="26" rx="3" fill="#dbeafe" stroke="#1d4ed8"/>
  <rect x="328" y="533" width="34" height="26" rx="3" fill="#dbeafe" stroke="#1d4ed8"/>
  <rect x="368" y="533" width="34" height="26" rx="3" fill="#dbeafe" stroke="#1d4ed8"/>
  <rect x="408" y="533" width="34" height="26" rx="3" fill="#dbeafe" stroke="#1d4ed8"/>
  <rect x="448" y="533" width="34" height="26" rx="3" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="490" y="551" font-size="14" fill="#1e3a8a">…</text>
  <text x="292.5" y="588" text-anchor="middle" font-size="11.5" fill="#14532d">three threads · MPI_THREAD_MULTIPLE · any node</text>
  <rect x="635" y="66" width="545" height="550" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="651" y="88" font-size="13" font-weight="bold" fill="#6b7280">Node of peer 1</text>
  <rect x="655" y="98" width="250" height="44" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="780" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">Workflow tasks on this node</text>
  <text x="780" y="133" text-anchor="middle" font-size="11.5" fill="#713f12">POSIX calls, Python, shell tools</text>
  <rect x="975" y="98" width="185" height="44" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="1067.5" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#0c4a6e">Mount point</text>
  <text x="1067.5" y="134" text-anchor="middle" font-size="12" font-family="Menlo, monospace" fill="#0c4a6e">&lt;root&gt;/1</text>
  <line x1="905" y1="120" x2="975" y2="120" stroke="#374151" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="1067.5" y1="142" x2="1067.5" y2="162" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="655" y="162" width="505" height="34" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="907.5" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Linux VFS + FUSE kernel module</text>
  <rect x="655" y="216" width="505" height="384" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="671" y="238" font-size="15" font-weight="bold" fill="#14532d">Peer 1 · dagonfs</text>
  <line x1="925" y1="196" x2="925" y2="266" stroke="#374151" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="933" y="212" font-size="11" font-family="Menlo, monospace" fill="#4b5563">/dev/fuse</text>
  <rect x="671" y="266" width="473" height="38" rx="6" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
  <text x="907.5" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">FUSE thread: FileSystem handlers</text>
  <line x1="745" y1="304" x2="745" y2="320" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="907" y1="304" x2="907" y2="320" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1069" y1="304" x2="1069" y2="320" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="671" y="320" width="149" height="64" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
  <text x="745.5" y="339" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Namespace replica</text>
  <text x="745.5" y="356" text-anchor="middle" font-size="10.5" fill="#1f2937">same tree on every peer</text>
  <text x="745.5" y="371" text-anchor="middle" font-size="10.5" fill="#1f2937">gid → File index</text>
  <rect x="833" y="320" width="149" height="64" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="907.5" y="339" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">Front-end buffer</text>
  <text x="907.5" y="356" text-anchor="middle" font-size="10.5" fill="#1e3a8a">File::m_buf, open → close</text>
  <text x="907.5" y="371" text-anchor="middle" font-size="10.5" fill="#1e3a8a">reloaded if changed remotely</text>
  <rect x="995" y="320" width="149" height="64" rx="6" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="1069.5" y="339" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#831843">Lock requests</text>
  <text x="1069.5" y="356" text-anchor="middle" font-size="10.5" fill="#831843">LOCK_* to peer 0</text>
  <text x="1069.5" y="371" text-anchor="middle" font-size="10.5" fill="#831843">replies may be deferred</text>
  <rect x="671" y="400" width="230" height="56" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="786" y="421" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">Listener thread</text>
  <text x="786" y="439" text-anchor="middle" font-size="11" fill="#4c1d95">slices, ACKs, LOCK_*; queues replays</text>
  <rect x="914" y="400" width="230" height="56" rx="6" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/>
  <text x="1029" y="421" text-anchor="middle" font-size="13" font-weight="bold" fill="#881337">Replayer thread</text>
  <text x="1029" y="439" text-anchor="middle" font-size="11" fill="#881337">replays remote namespace ops (FIFO)</text>
  <polyline points="1144,420 1171,420 1171,179 1160,179" fill="none" stroke="#be123c" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
  <line x1="907" y1="384" x2="907" y2="472" stroke="#374151" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="785" y1="456" x2="785" y2="472" stroke="#374151" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="671" y="472" width="473" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="907.5" y="497" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Data plane: DataBlockManager <tspan font-weight="normal" font-size="11.5">(scatterStore · gatherLoad)</tspan></text>
  <line x1="907" y1="512" x2="907" y2="524" stroke="#374151" stroke-width="1.5"/>
  <rect x="671" y="524" width="473" height="44" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="685" y="551" font-size="12.5" font-weight="bold" fill="#1e3a8a">Block registry: slice c<tspan font-size="9" dy="3">1</tspan><tspan dy="-3"> of every file</tspan></text>
  <rect x="903" y="533" width="34" height="26" rx="3" fill="#dbeafe" stroke="#1d4ed8"/>
  <rect x="943" y="533" width="34" height="26" rx="3" fill="#dbeafe" stroke="#1d4ed8"/>
  <rect x="983" y="533" width="34" height="26" rx="3" fill="#dbeafe" stroke="#1d4ed8"/>
  <rect x="1023" y="533" width="34" height="26" rx="3" fill="#dbeafe" stroke="#1d4ed8"/>
  <rect x="1063" y="533" width="34" height="26" rx="3" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="1105" y="551" font-size="14" fill="#1e3a8a">…</text>
  <text x="907.5" y="588" text-anchor="middle" font-size="11.5" fill="#14532d">three threads · MPI_THREAD_MULTIPLE · any node</text>
  <g stroke="#374151" stroke-width="1.8">
    <line x1="565" y1="300" x2="635" y2="300" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="565" y1="428" x2="635" y2="428" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="565" y1="520" x2="635" y2="520" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <circle cx="600" cy="300" r="11" fill="#be123c"/><text x="600" y="304">1</text>
    <circle cx="600" cy="428" r="11" fill="#1d4ed8"/><text x="600" y="432">2</text>
    <circle cx="600" cy="520" r="11" fill="#be185d"/><text x="600" y="524">3</text>
  </g>
  <text x="600" y="372" text-anchor="middle" font-size="11" fill="#4b5563">MPI</text>
  <text x="600" y="386" text-anchor="middle" font-size="11" fill="#4b5563">point-</text>
  <text x="600" y="400" text-anchor="middle" font-size="11" fill="#4b5563">to-point</text>

  <!-- other peers -->
  <rect x="20" y="636" width="1160" height="52" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="600" y="656" text-anchor="middle" font-size="13" fill="#14532d"><tspan font-weight="bold">Peers 2 … P−1</tspan>: the same three threads, mount &lt;root&gt;/r and slice c<tspan font-size="9" dy="3">r</tspan><tspan dy="-3">; they exchange 1 and 2 with every peer and 3 with peer 0.</tspan></text>
  <text x="600" y="676" text-anchor="middle" font-size="12" fill="#14532d">A file has the same identity on every peer: <tspan font-family="Menlo, monospace" font-size="11.5">gid = ((creator rank + 1) &lt;&lt; 48) | creator inode</tspan></text>
  <line x1="292" y1="636" x2="292" y2="616" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="907" y1="636" x2="907" y2="616" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <!-- legend -->
  <g>
    <rect x="20" y="704" width="376" height="112" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="40" cy="724" r="9" fill="#be123c"/><text x="40" y="728" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1</text>
    <text x="56" y="728" font-size="13" font-weight="bold" fill="#881337">Namespace and metadata → every peer</text>
    <g font-family="Menlo, monospace" font-size="10.5" fill="#374151">
      <text x="36" y="748">CREATE_FILE {gid} · MKNOD · CREATE_DIR</text>
      <text x="36" y="764">DELETE_FILE · DELETE_DIR · RENAME · LINK</text>
      <text x="36" y="780">SYMLINK · SET_ATTR · SET_XATTR · REMOVE_XATTR</text>
    </g>
    <text x="36" y="802" font-size="11.5" fill="#4b5563">replayed through the mount; asynchronous, ordered per peer</text>
  </g>
  <g>
    <rect x="412" y="704" width="376" height="112" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="432" cy="724" r="9" fill="#1d4ed8"/><text x="432" y="728" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">2</text>
    <text x="448" y="728" font-size="13" font-weight="bold" fill="#1e3a8a">Data: originator ↔ every peer</text>
    <g font-family="Menlo, monospace" font-size="10.5" fill="#374151">
      <text x="428" y="748">WRITE + STORE slices (tag 1) → ACK (tag 3)</text>
      <text x="428" y="764">READ → LOAD slices (tag 2)</text>
    </g>
    <text x="428" y="786" font-size="11.5" fill="#4b5563">close/fsync returns after every peer has stored its</text>
    <text x="428" y="802" font-size="11.5" fill="#4b5563">slice: close-to-open consistency</text>
  </g>
  <g>
    <rect x="804" y="704" width="376" height="112" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="824" cy="724" r="9" fill="#be185d"/><text x="824" y="728" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>
    <text x="840" y="728" font-size="13" font-weight="bold" fill="#831843">Locks: peer ↔ peer 0</text>
    <g font-family="Menlo, monospace" font-size="10.5" fill="#374151">
      <text x="820" y="748">LOCK_SET · LOCK_GET · LOCK_RELEASE</text>
      <text x="820" y="764">LOCK_CANCEL → LOCK_REPLY</text>
    </g>
    <text x="820" y="786" font-size="11.5" fill="#4b5563">fcntl, lockf and flock are cluster-wide; releasing</text>
    <text x="820" y="802" font-size="11.5" fill="#4b5563">a lock writes the file back first</text>
  </g>
</svg>
