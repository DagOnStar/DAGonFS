<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica, Arial, sans-serif">
  <title>Contiguous block distribution of a 10-block file over 4 MPI ranks</title>
  <rect x="0" y="0" width="760" height="330" rx="12" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">File of S bytes → N = ⌈S / 128 KiB⌉ = 10 blocks, P = 4 ranks</text>

  <!-- front-end buffer -->
  <text x="40" y="70" font-size="13" fill="#374151">Front-end buffer (root rank), zero-padded to N·B bytes</text>
  <g font-size="12" text-anchor="middle" fill="#111827">
    <rect x="40"  y="80" width="64" height="36" fill="#dbeafe" stroke="#1d4ed8"/><text x="72"  y="103">b0</text>
    <rect x="104" y="80" width="64" height="36" fill="#dbeafe" stroke="#1d4ed8"/><text x="136" y="103">b1</text>
    <rect x="168" y="80" width="64" height="36" fill="#dbeafe" stroke="#1d4ed8"/><text x="200" y="103">b2</text>
    <rect x="232" y="80" width="64" height="36" fill="#dcfce7" stroke="#15803d"/><text x="264" y="103">b3</text>
    <rect x="296" y="80" width="64" height="36" fill="#dcfce7" stroke="#15803d"/><text x="328" y="103">b4</text>
    <rect x="360" y="80" width="64" height="36" fill="#dcfce7" stroke="#15803d"/><text x="392" y="103">b5</text>
    <rect x="424" y="80" width="64" height="36" fill="#fef3c7" stroke="#b45309"/><text x="456" y="103">b6</text>
    <rect x="488" y="80" width="64" height="36" fill="#fef3c7" stroke="#b45309"/><text x="520" y="103">b7</text>
    <rect x="552" y="80" width="64" height="36" fill="#fce7f3" stroke="#be185d"/><text x="584" y="103">b8</text>
    <rect x="616" y="80" width="64" height="36" fill="#fce7f3" stroke="#be185d"/><text x="648" y="103">b9*</text>
  </g>
  <text x="690" y="132" text-anchor="end" font-size="11" fill="#6b7280">* last block zero-padded</text>

  <!-- arrows -->
  <g stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M136 120 L130 200"/>
    <path d="M328 120 L320 200"/>
    <path d="M488 120 L500 200"/>
    <path d="M616 120 L660 200"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <text x="380" y="170" text-anchor="middle" font-size="12" fill="#374151">MPI_Scatterv (store) / MPI_Gatherv (load), counts in block-sized datatypes</text>

  <!-- ranks -->
  <g font-size="12" fill="#111827">
    <rect x="40"  y="205" width="170" height="88" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="125" y="225" text-anchor="middle" font-weight="bold">rank 0</text>
    <text x="125" y="245" text-anchor="middle">c₀ = 3, d₀ = 0</text>
    <text x="125" y="265" text-anchor="middle">b0 b1 b2</text>

    <rect x="225" y="205" width="170" height="88" rx="8" fill="#f0fdf4" stroke="#15803d"/>
    <text x="310" y="225" text-anchor="middle" font-weight="bold">rank 1</text>
    <text x="310" y="245" text-anchor="middle">c₁ = 3, d₁ = 3</text>
    <text x="310" y="265" text-anchor="middle">b3 b4 b5</text>

    <rect x="410" y="205" width="150" height="88" rx="8" fill="#fffbeb" stroke="#b45309"/>
    <text x="485" y="225" text-anchor="middle" font-weight="bold">rank 2</text>
    <text x="485" y="245" text-anchor="middle">c₂ = 2, d₂ = 6</text>
    <text x="485" y="265" text-anchor="middle">b6 b7</text>

    <rect x="575" y="205" width="150" height="88" rx="8" fill="#fdf2f8" stroke="#be185d"/>
    <text x="650" y="225" text-anchor="middle" font-weight="bold">rank 3</text>
    <text x="650" y="245" text-anchor="middle">c₃ = 2, d₃ = 8</text>
    <text x="650" y="265" text-anchor="middle">b8 b9</text>
  </g>
  <text x="380" y="315" text-anchor="middle" font-size="12" fill="#374151">c_r = ⌊N/P⌋ + [r &lt; N mod P]   ·   each rank keeps only its own DataBlocks; no addresses are exchanged</text>
</svg>
