<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Helvetica, Arial, sans-serif">
  <title>DAGonFS client-server model</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">DAGonFS client-server model</text>
  <text x="600" y="54" text-anchor="middle" font-size="13" fill="#4b5563"><tspan font-family="Menlo, monospace" font-size="12">dagonfs --model client-server</tspan>: rank 0 mounts the volume and owns the namespace; ranks 1…P−1 store blocks</text>

  <!-- Node of rank 0 -->
  <rect x="20" y="72" width="700" height="712" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="36" y="94" font-size="13" font-weight="bold" fill="#6b7280">Node hosting rank 0</text>

  <rect x="40" y="106" width="280" height="46" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="180" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">Workflow tasks (client processes)</text>
  <text x="180" y="143" text-anchor="middle" font-size="11.5" fill="#713f12">POSIX calls, Python, shell tools</text>

  <rect x="420" y="106" width="180" height="46" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="510" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#0c4a6e">Mount point</text>
  <text x="510" y="143" text-anchor="middle" font-size="12" font-family="Menlo, monospace" fill="#0c4a6e">&lt;root&gt;</text>

  <line x1="320" y1="129" x2="420" y2="129" stroke="#374151" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="370" y="121" text-anchor="middle" font-size="11" fill="#4b5563">operations</text>

  <rect x="40" y="178" width="640" height="40" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="360" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Linux VFS + FUSE kernel module</text>
  <line x1="510" y1="152" x2="510" y2="178" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="218" x2="360" y2="250" stroke="#374151" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="370" y="239" font-size="11" font-family="Menlo, monospace" fill="#4b5563">/dev/fuse</text>

  <!-- Rank 0 process -->
  <rect x="40" y="250" width="660" height="515" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="56" y="273" font-size="15" font-weight="bold" fill="#14532d">Rank 0 · dagonfs front end</text>
  <text x="684" y="273" text-anchor="end" font-size="11.5" fill="#14532d">single-threaded FUSE loop · MPI_THREAD_SINGLE</text>

  <rect x="60" y="288" width="620" height="44" rx="6" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
  <text x="370" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">FileSystem: FUSE low-level handlers (src/ramfs)</text>

  <g stroke="#374151" stroke-width="1.5">
    <line x1="158" y1="332" x2="158" y2="362" marker-end="url(#arr)"/>
    <line x1="370" y1="332" x2="370" y2="362" marker-end="url(#arr)"/>
    <line x1="582" y1="332" x2="582" y2="362" marker-end="url(#arr)"/>
  </g>

  <g stroke-width="1.5">
    <rect x="60"  y="362" width="196" height="84" rx="6" fill="#ffffff" stroke="#4b5563"/>
    <rect x="272" y="362" width="196" height="84" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
    <rect x="484" y="362" width="196" height="84" rx="6" fill="#fce7f3" stroke="#be185d"/>
  </g>
  <g text-anchor="middle">
    <text x="158" y="382" font-size="13" font-weight="bold" fill="#1f2937">Namespace</text>
    <g font-size="11.5" fill="#374151">
      <text x="158" y="400">inode table (Nodes)</text>
      <text x="158" y="416">Directory · File</text>
      <text x="158" y="432">SymbolicLink · xattrs</text>
    </g>
    <text x="370" y="382" font-size="13" font-weight="bold" fill="#1e3a8a">Front-end file buffer</text>
    <g font-size="11.5" fill="#1e3a8a">
      <text x="370" y="400">whole file in File::m_buf</text>
      <text x="370" y="416">held from open to close</text>
      <text x="370" y="432">close-to-open consistency</text>
    </g>
    <text x="582" y="382" font-size="13" font-weight="bold" fill="#831843">Lock table</text>
    <g font-size="11.5" fill="#831843">
      <text x="582" y="400">fcntl · lockf · flock</text>
      <text x="582" y="416">waiters, deadlock detection</text>
      <text x="582" y="432">replies may be deferred</text>
    </g>
  </g>

  <!-- FS -> control plane (routed along the left edge) -->
  <polyline points="60,320 50,320 50,509 60,509" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="440" y1="446" x2="440" y2="476" stroke="#374151" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="448" y="465" font-size="11" fill="#4b5563">load on open · store on flush/close</text>

  <rect x="60"  y="476" width="300" height="66" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="210" y="502" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">Control plane: RequestSender</text>
  <text x="210" y="522" text-anchor="middle" font-size="11.5" fill="#4c1d95">one PeerRequest message per rank (tag 0)</text>

  <rect x="380" y="476" width="300" height="66" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="530" y="502" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Data plane: DataBlockManager</text>
  <text x="530" y="522" text-anchor="middle" font-size="11.5" fill="#1e3a8a">scatterStore (write-back) · gatherLoad (read)</text>
  <line x1="360" y1="509" x2="380" y2="509" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="60" y="572" width="300" height="100" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="210" y="594" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Volume: runVolume()</text>
  <g text-anchor="middle" font-size="11.5" fill="#374151">
    <text x="210" y="614" font-family="Menlo, monospace" font-size="11">--model client-server</text>
    <text x="210" y="632"><tspan font-family="Menlo, monospace" font-size="11">DAGonFS.ini</tspan> (dagonfs_model)</text>
    <text x="210" y="650">C++ and Python Volume APIs</text>
  </g>

  <line x1="530" y1="542" x2="530" y2="572" stroke="#374151" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="380" y="572" width="300" height="100" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="530" y="594" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Local block registry (Blocks)</text>
  <text x="530" y="612" text-anchor="middle" font-size="11.5" fill="#1e3a8a">slice c<tspan font-size="9" dy="3">0</tspan><tspan dy="-3"> of every file, 128 KiB DataBlocks</tspan></text>
  <g fill="#dbeafe" stroke="#1d4ed8" stroke-width="1">
    <rect x="404" y="626" width="40" height="30" rx="3"/><rect x="450" y="626" width="40" height="30" rx="3"/>
    <rect x="496" y="626" width="40" height="30" rx="3"/><rect x="542" y="626" width="40" height="30" rx="3"/>
    <rect x="588" y="626" width="40" height="30" rx="3"/>
  </g>
  <text x="645" y="646" font-size="14" fill="#1e3a8a">…</text>

  <g font-size="12.5" fill="#14532d">
    <text x="60" y="702">Rank 0 holds the complete namespace and the lock table, and originates</text>
    <text x="60" y="720">every transfer. Tasks must run on this node; file contents are spread</text>
    <text x="60" y="738">over the RAM of all ranks, which may be on other nodes.</text>
  </g>

  <!-- Storage ranks -->
  <g id="rank1">
    <rect x="800" y="72" width="380" height="250" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
    <text x="816" y="95" font-size="15" font-weight="bold" fill="#14532d">Rank 1 · storage server</text>
    <text x="816" y="113" font-size="11.5" fill="#14532d">any node · no FUSE mount · listener on the main thread</text>
    <rect x="820" y="126" width="340" height="50" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="990" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">Listener: DistributedCode</text>
    <text x="990" y="164" text-anchor="middle" font-size="11.5" fill="#4c1d95">serves WRITE, READ, DELETE, TERMINATE</text>
    <line x1="990" y1="176" x2="990" y2="192" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="820" y="192" width="340" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="990" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Data plane: DataBlockManager</text>
    <line x1="990" y1="232" x2="990" y2="248" stroke="#374151" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <rect x="820" y="248" width="340" height="62" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="836" y="268" font-size="12.5" font-weight="bold" fill="#1e3a8a">Block registry: slice c<tspan font-size="9" dy="3">1</tspan><tspan dy="-3"> of every file</tspan></text>
    <g fill="#dbeafe" stroke="#1d4ed8" stroke-width="1">
      <rect x="836" y="277" width="40" height="24" rx="3"/><rect x="882" y="277" width="40" height="24" rx="3"/>
      <rect x="928" y="277" width="40" height="24" rx="3"/><rect x="974" y="277" width="40" height="24" rx="3"/>
    </g>
    <text x="1024" y="294" font-size="14" fill="#1e3a8a">…</text>
  </g>

  <text x="990" y="356" text-anchor="middle" font-size="26" fill="#6b7280">⋮</text>

  <g>
    <rect x="800" y="372" width="380" height="250" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
    <text x="816" y="395" font-size="15" font-weight="bold" fill="#14532d">Rank P−1 · storage server</text>
    <text x="816" y="413" font-size="11.5" fill="#14532d">any node · no FUSE mount · listener on the main thread</text>
    <rect x="820" y="426" width="340" height="50" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="990" y="446" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">Listener: DistributedCode</text>
    <text x="990" y="464" text-anchor="middle" font-size="11.5" fill="#4c1d95">serves WRITE, READ, DELETE, TERMINATE</text>
    <line x1="990" y1="476" x2="990" y2="492" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="820" y="492" width="340" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="990" y="516" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">Data plane: DataBlockManager</text>
    <line x1="990" y1="532" x2="990" y2="548" stroke="#374151" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <rect x="820" y="548" width="340" height="62" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="836" y="568" font-size="12.5" font-weight="bold" fill="#1e3a8a">Block registry: slice c<tspan font-size="9" dy="3">P−1</tspan><tspan dy="-3"> of every file</tspan></text>
    <g fill="#dbeafe" stroke="#1d4ed8" stroke-width="1">
      <rect x="836" y="577" width="40" height="24" rx="3"/><rect x="882" y="577" width="40" height="24" rx="3"/>
      <rect x="928" y="577" width="40" height="24" rx="3"/>
    </g>
    <text x="978" y="594" font-size="14" fill="#1e3a8a">…</text>
  </g>

  <!-- MPI fan-out -->
  <g stroke="#374151" stroke-width="1.8" fill="none">
    <line x1="680" y1="509" x2="745" y2="509"/>
    <polyline points="745,509 745,151 820,151" marker-end="url(#arr)"/>
    <polyline points="745,509 745,451 820,451" marker-end="url(#arr)"/>
  </g>
  <circle cx="745" cy="509" r="3.5" fill="#374151"/>
  <text x="760" y="300" font-size="12" fill="#374151" transform="rotate(90 760 300)" text-anchor="middle">MPI point-to-point, tags 0–3</text>

  <!-- Message legend -->
  <rect x="760" y="644" width="420" height="140" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="776" y="666" font-size="13" font-weight="bold" fill="#1f2937">MPI point-to-point messages (no collectives)</text>
  <g font-family="Menlo, monospace" font-size="11.5" fill="#374151">
    <text x="776" y="690">tag 0</text><text x="830" y="690" font-weight="bold">REQUEST</text><text x="900" y="690">WRITE · READ · DELETE · TERMINATE</text>
    <text x="776" y="710">tag 1</text><text x="830" y="710" font-weight="bold">STORE</text><text x="900" y="710">rank 0 → rank r: c<tspan font-size="9" dy="3">r</tspan><tspan dy="-3"> blocks</tspan></text>
    <text x="776" y="730">tag 2</text><text x="830" y="730" font-weight="bold">LOAD</text><text x="900" y="730">rank r → rank 0: c<tspan font-size="9" dy="3">r</tspan><tspan dy="-3"> blocks</tspan></text>
    <text x="776" y="750">tag 3</text><text x="830" y="750" font-weight="bold">ACK</text><text x="900" y="750">WRITE applied on rank r</text>
  </g>
  <text x="776" y="772" font-size="11.5" fill="#6b7280">A close returns only after every rank has acknowledged.</text>
</svg>
