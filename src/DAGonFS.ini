[DAGonFS_config]
# Number of MPI ranks (client-server: 1 front end + storage ranks;
# peer-to-peer: one peer, and one mount point, per rank).
num_processes = 8
# Optional Open MPI hostfile; leave empty to run on the local host.
machinefile =
# client-server | peer-to-peer
dagonfs_model = client-server
# f = foreground (required under MPI), d = foreground with FUSE debug output
fuse_mode = f
# Mount point (client-server) or parent of the per-rank mount points (peer-to-peer)
dagonfs_root_dir = /tmp/DAGonFS
# true enables verbose log4cplus output
enable_logging = false
# MPI launcher command
mpirun = mpirun
